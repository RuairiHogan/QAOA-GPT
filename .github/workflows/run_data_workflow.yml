name: Run QAOA Generator

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy networkx qiskit scipy

      - name: Run generator
        run: |
          cd "QAOA-GPT Training Data"
          python ADAPT_QAOA_kingston.py

      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: qaoa-dataset
          path: "QAOA-GPT Training Data/qaoa_gpt_dataset_kingston_temp_data.jsonl"