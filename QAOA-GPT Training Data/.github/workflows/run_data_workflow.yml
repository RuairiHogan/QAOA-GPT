name: Run QAOA Generator

on:
  workflow_dispatch:   # lets you start it manually

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # max allowed (6 hours)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run loop script
        run: |
          python run_data_creation.py